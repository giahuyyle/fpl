[pytest]
testpaths = tests
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov=main
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=95
